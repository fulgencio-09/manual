<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manual HU</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="app">
    <header><div class="brand-mark">MH</div><div><h1>Manual HU</h1><p>Grabador de ejecución · PDF profesional</p></div></header>

    <label for="storyId">Historia de usuario</label>
    <input id="storyId" type="text" maxlength="80" placeholder="Ej. HU-025">
    <label for="storyTitle">Título de la historia / funcionalidad</label>
    <input id="storyTitle" type="text" maxlength="160" placeholder="Ej. Registrar factura">

    <details open><summary>Datos del manual</summary>
      <label for="systemName">Sistema de información</label><input id="systemName" type="text" maxlength="120" placeholder="Ej. SIDED SSO">
      <label for="module">Módulo / ruta</label><input id="module" type="text" maxlength="160" placeholder="Ej. Casos › Actuaciones">
      <label for="process">Proceso</label><input id="process" type="text" maxlength="120" placeholder="Ej. Gestión de información">
      <label for="dependency">Dependencia responsable</label><input id="dependency" type="text" maxlength="120" placeholder="Ej. Oficina / Dirección">
      <label for="classification">Clasificación de la información</label><select id="classification"><option value="">No especificado</option><option>Pública</option><option>Clasificada</option><option>Reservada</option></select>
    </details>

    <section class="status-card"><span id="statusDot" class="dot"></span><div><strong id="statusText">Grabación detenida</strong><small id="stepCount">0 pasos registrados</small></div></section>
    <div class="actions"><button id="startBtn" class="primary">Iniciar grabación</button><button id="pauseBtn" disabled>Pausar</button><button id="finishBtn" class="dark">Finalizar y generar PDF</button></div>
    <button id="clearBtn" class="link">Limpiar esta ejecución</button>
    <p id="notice" role="status" aria-live="polite"></p>
    <footer>Registra acciones y evidencias. No guarda contraseñas ni valores digitados. El PDF se genera mediante el servidor local.</footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
